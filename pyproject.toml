[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pokesleep-box-score"
version = "0.1.0"
description = "MuMu capture, OCR, and local/Daifuku-assisted Pokémon Sleep box scoring"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.5.2",
  "onnxruntime==1.29.0",
  "opencv-python==5.0.0.93",
  "pillow==12.3.0",
  "rapidocr==3.9.2",
]

[project.optional-dependencies]
daifuku = ["playwright==1.62.0"]
dev = ["pytest>=8.3", "ruff>=0.12"]

[project.scripts]
pokesleep-score = "pokesleep_score.cli:main"

[tool.setuptools]
packages = ["pokesleep_score"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
