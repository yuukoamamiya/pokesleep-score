name: tests

on:
  push:
  pull_request:

jobs:
  test:
    env:
      PYTHONUTF8: "1"
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline demo
        run: python -m pokesleep_score demo
      - name: Public release check
        run: python scripts/public_release_check.py
