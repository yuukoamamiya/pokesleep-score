name: Bug report
description: Report a reproducible capture, OCR, scoring, or output problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach browser profiles, cookies, credentials, or unsanitized box data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python, MuMu/ADB version if relevant
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor output
      render: text
